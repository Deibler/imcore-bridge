name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The client is tested against a stub socket, so protocol handling, capability
  # gating and error mapping are covered on a stock runner with no injection.
  client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # A workflow file that does not parse fails OUTSIDE every required
      # check: GitHub records a startup failure against unrelated pushes and
      # the pull request that introduced it stays green. One did, and it took
      # a missing release to notice. Parse them in the check that gates merges.
      - name: Workflow files parse
        run: |
          ruby -ryaml -e '
            bad = Dir[".github/workflows/*.yml"].reject do |f|
              begin
                YAML.parse(File.read(f))
                true
              rescue Psych::SyntaxError => e
                warn "#{f}: #{e.message}"
                false
              end
            end
            abort("#{bad.size} workflow file(s) do not parse") unless bad.empty?
            puts "workflows parse"
          '
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build:ts
      - name: Test
        run: bun test test

      # The published entry points are not the same thing as a successful
      # build. `main`, `types` and `bin` are paths into dist that nothing else
      # here exercises, so a change in the output layout leaves every other
      # check green and still ships a package that cannot be imported. This
      # installs the tarball the way a consumer would, imports it by name, and
      # runs the installed binary — `bin` resolves separately from `main`, and
      # `--version` is the one command that answers without a bridge.
      - name: Verify the packed package imports and runs by name
        run: |
          npm pack
          smoke=$(mktemp -d)
          cp imcore-bridge-*.tgz "$smoke/"
          cd "$smoke"
          npm init -y > /dev/null
          npm install ./imcore-bridge-*.tgz
          node --input-type=module -e '
            import { ImcoreBridge } from "imcore-bridge";
            if (typeof ImcoreBridge?.connect !== "function") {
              throw new Error("package entry point does not expose ImcoreBridge");
            }
            console.log("entry points resolve");
          '
          ./node_modules/.bin/imcore-bridge --version
          ./node_modules/.bin/imcore-bridge --help > /dev/null

          # The dylib is compiled at install time rather than shipped, so a
          # consumer install is only complete if postinstall actually ran and
          # produced it. Without this the package installs cleanly and cannot
          # send, which is the failure the build-native command exists for.
          dylib=node_modules/imcore-bridge/native/build/imcore-bridge.dylib
          test -f "$dylib" || { echo "postinstall did not build the dylib"; exit 1; }

          # And the recovery path: a machine that installed with scripts
          # disabled, or gained the command line tools afterwards, has to be
          # able to build it later. Remove it and put it back by command.
          rm "$dylib"
          ./node_modules/.bin/imcore-bridge build-native
          test -f "$dylib" || { echo "build-native did not produce the dylib"; exit 1; }

  # Compiling the dylib and probing selectors needs no injection, so a plain
  # runner still catches a macOS update that removes an API we depend on.
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: make -C native
      - name: Verify it loads and is the right architecture
        run: |
          file native/build/imcore-bridge.dylib
          lipo -archs native/build/imcore-bridge.dylib | grep -q arm64e
          codesign -dv native/build/imcore-bridge.dylib 2>&1 | grep -q adhoc
