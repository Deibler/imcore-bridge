name: Release

# Changesets flow. Every merged change carries a .changeset entry; this
# workflow keeps a "Version packages" pull request open that bumps
# package.json and CHANGELOG.md. Merging that pull request tags the release
# and attaches the tarball in the same job.
#
# The attach step is deliberately NOT a separate tag-triggered workflow. A tag
# pushed with the default token does not start a workflow run, so a tag
# trigger never fires here and leaves a release with nothing installable
# behind it. Doing it inline is an API call rather than an event, which works.
#
# The package is distributed as a GitHub Release asset rather than through
# npm. The tarball is exactly what `npm pack` produces, so `bun add <url>` and
# `npm install <url>` both work, and nobody needs a registry account or a
# token for either publishing or installing.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release-${{ github.ref }}

jobs:
  version:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Version pull request, or tag the release
        uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: "Version packages"
          pr-title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the tarball to the release for whatever version is on main, if
      # that version is tagged and does not have it yet. Idempotent and safe to
      # run on every push: it exits immediately when there is nothing to do,
      # which also lets it repair a release that was created without an asset.
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the version from the COMMIT, not the working tree. The
          # changesets step above runs the version script in place to build its
          # pull request, so package.json on disk is already the NEXT version
          # while HEAD is still the released one. Reading the tree asks for a
          # tag that does not exist yet and silently attaches nothing.
          git show HEAD:package.json > /tmp/released-package.json
          version=$(node -p "require('/tmp/released-package.json').version")
          tag="v$version"
          tarball="imcore-bridge-$version.tgz"
          echo "committed version $version"

          # npm pack reads the working tree, which may be ahead. Put the
          # manifest back so the tarball matches the tag it is attached to.
          git checkout -- package.json

          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "no tag $tag; nothing to attach"
            exit 0
          fi
          if gh release view "$tag" --json assets \
               --jq '[.assets[].name] | join(" ")' 2>/dev/null | grep -qw "$tarball"; then
            echo "$tag already carries $tarball"
            exit 0
          fi

          npm pack

          # A consumer installs the asset, not the checkout. Prove the artifact
          # about to be attached is the one that works.
          smoke=$(mktemp -d)
          cp "$tarball" "$smoke/"
          (
            cd "$smoke"
            npm init -y > /dev/null
            npm install "./$tarball"
            node --input-type=module -e '
              import { ImcoreBridge } from "imcore-bridge";
              if (typeof ImcoreBridge?.connect !== "function") {
                throw new Error("packaged entry point does not expose ImcoreBridge");
              }
            '
            ./node_modules/.bin/imcore-bridge --version
            test -f node_modules/imcore-bridge/native/build/imcore-bridge.dylib
          )

          {
            echo "Install without a registry account:"
            echo
            echo '```bash'
            echo "bun add https://github.com/$REPO/releases/download/$tag/$tarball"
            echo '```'
            echo
            echo "See CHANGELOG.md for what changed."
          } > release-notes.md

          gh release create "$tag" "$tarball" --title "$tag" --notes-file release-notes.md \
            || gh release upload "$tag" "$tarball" --clobber

          # Uploading is a claim. This step already reported success once while
          # attaching nothing, so confirm the asset is on the release.
          gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")' \
            | grep -qw "$tarball" || {
              echo "upload reported success but $tag carries no $tarball"
              exit 1
            }
          echo "attached $tarball to $tag"
